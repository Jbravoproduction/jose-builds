<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>To my love Naomi</title>
<meta name="description" content="Lilies, for you.">
<meta property="og:title" content="To my love Naomi">
<meta property="og:description" content="Lilies, for you.">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hint {
    position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-family: Georgia, serif; font-style: italic; font-size: 13px;
    color: rgba(255, 220, 235, .4); opacity: 0; transition: opacity 2s ease; pointer-events: none;
  }
  .hint.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">tap to watch it again</div>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const hint = document.getElementById("hint");

  let W, H, DPR, unit, cx, groundY;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    unit = Math.min((H * 0.84) / 3.5, (W * 0.94) / 2.25);
    cx = W / 2;
    groundY = H * 0.5 + unit * 1.62;
  }
  window.addEventListener("resize", resize);
  resize();

  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const clamp = (v) => Math.max(0, Math.min(1, v));
  const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
  const norm = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const rgb = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

  // ---------- The scene, as points in 3D (y is up) ----------
  const fixed = []; // {x,y,z,col,size,ry,layer}
  const add = (x, y, z, col, size, ry, layer) => fixed.push({ x, y, z, col: rgb(col), size, ry: ry ?? y, layer });

  // Pedestal: two glassy rings and a faint disc.
  for (let i = 0; i < 520; i++) {
    const a = (i / 520) * Math.PI * 2;
    add(Math.cos(a) * 0.74, 0, Math.sin(a) * 0.74, [215, 225, 230], 1.3, 0, 0);
    add(Math.cos(a) * 0.66, 0.08, Math.sin(a) * 0.66, [235, 240, 245], 1.3, 0.02, 0);
    add(Math.cos(a) * 0.5, 0.1, Math.sin(a) * 0.5, [200, 215, 225], 1.1, 0.04, 0);
  }
  for (let i = 0; i < 260; i++) {
    const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 0.64;
    add(Math.cos(a) * r, 0.085, Math.sin(a) * r, [150, 165, 175], 1, 0.03, 0);
  }

  // The cone of wrapping paper, ruffled at the top, with a pink ribbon.
  const coneBot = 0.14, coneTop = 1.38;
  const coneR = (y) => 0.09 + ((y - coneBot) / (coneTop - coneBot)) * 0.5;
  for (let i = 0; i < 2800; i++) {
    const a = rnd() * Math.PI * 2;
    const top = coneTop + Math.sin(a * 5) * 0.05;
    const y = coneBot + Math.pow(rnd(), 0.8) * (top - coneBot);
    const r = coneR(Math.min(y, coneTop));
    const tone = 0.82 + rnd() * 0.25;
    let col = [236 * tone, 214 * tone, 182 * tone];
    if (rnd() < 0.06) col = [255, 238, 228];
    add(Math.cos(a) * r, y, Math.sin(a) * r, col, 1.6, y, 1);
  }
  for (let i = 0; i < 380; i++) {
    const a = rnd() * Math.PI * 2, y = 0.5 + rnd() * 0.07;
    add(Math.cos(a) * (coneR(y) + 0.008), y, Math.sin(a) * (coneR(y) + 0.008), mix([232, 88, 140], [255, 170, 200], rnd()), 1.8, y, 1);
  }
  for (let i = 0; i < 90; i++) {
    // Bow hanging off the front.
    const t = rnd(), side = rnd() < 0.5 ? -1 : 1;
    const x = side * (0.05 + t * 0.12), y = 0.53 - t * 0.22 + Math.sin(t * 6) * 0.02;
    add(x, y, coneR(0.53) + 0.02, mix([232, 88, 140], [255, 190, 210], rnd()), 1.8, y, 1);
  }

  // ---------- Lilies ----------
  const palettes = [
    ["#a3104a", "#ea5f97", "#fff3f7", [120, 0, 45]],
    ["#d9e8b8", "#fbfdf4", "#ffffff", [190, 150, 90]],
    ["#e87aa8", "#f8bfd5", "#fff6f9", [170, 20, 80]],
    ["#d4521a", "#f58a3c", "#ffc48a", [70, 20, 5]],
    ["#b81a5a", "#f27aa8", "#ffffff", [120, 0, 45]],
    ["#e3c25a", "#fff0b8", "#fffdf0", [150, 90, 20]],
    ["#f0b3c8", "#fde4ee", "#ffffff", [190, 60, 110]],
    ["#8f0d3e", "#d43a77", "#f9b9d0", [80, 0, 30]],
    ["#c0336e", "#f59cc0", "#fff8fb", [130, 10, 55]],
  ];
  const lilies = palettes.map((p, i) => {
    const a = (i / palettes.length) * Math.PI * 2 + rnd() * 0.4;
    const r = i === 0 ? 0.04 : 0.2 + rnd() * 0.4;
    const y = 2.05 + rnd() * 0.75 - r * 0.6;
    const C = [Math.cos(a) * r, y, Math.sin(a) * r];
    const A = norm([C[0] * 1.6, 1, C[2] * 1.6]);
    const ref = Math.abs(A[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    const P1 = norm(cross(A, ref)), P2 = cross(A, P1);
    const L = 0.3 + rnd() * 0.08;
    const cols = [hex(p[0]), hex(p[1]), hex(p[2])];
    const petals = [];
    for (let k = 0; k < 6; k++) {
      const pts = [];
      const n = 140;
      for (let j = 0; j < n; j++) {
        const u = Math.pow(rnd(), 0.85), v = rnd() * 2 - 1;
        let col = u < 0.5 ? mix(cols[0], cols[1], u / 0.5) : mix(cols[1], cols[2], (u - 0.5) / 0.5);
        if (u > 0.1 && u < 0.5 && rnd() < 0.12) col = p[3];
        if (Math.abs(v) < 0.12 && u < 0.45) col = mix(col, [215, 235, 150], 0.6); // nectar groove
        pts.push({ u, v, col: rgb(col) });
      }
      petals.push({ ang: (k / 6) * Math.PI * 2 + rnd() * 0.15, inner: k % 2 === 1, pts });
    }
    // Stem from inside the cone up to the flower.
    const B = [Math.cos(a) * 0.04, 0.45, Math.sin(a) * 0.04];
    const M = [C[0] * 0.35, (B[1] + C[1]) * 0.5, C[2] * 0.35];
    for (let j = 0; j <= 80; j++) {
      const t = j / 80, u = 1 - t;
      const x = u * u * B[0] + 2 * u * t * M[0] + t * t * (C[0] - A[0] * 0.03);
      const yy = u * u * B[1] + 2 * u * t * M[1] + t * t * (C[1] - A[1] * 0.03);
      const z = u * u * B[2] + 2 * u * t * M[2] + t * t * (C[2] - A[2] * 0.03);
      add(x, yy, z, mix([45, 110, 50], [110, 190, 95], rnd()), 1.9, yy, 2);
      // A long lily leaf off each stem.
      if (j === 46 || j === 30) {
        const side = j === 46 ? 1 : -1;
        const dir = norm([Math.cos(a + side * 1.2), 0.7, Math.sin(a + side * 1.2)]);
        for (let q = 0; q < 45; q++) {
          const s = rnd(), w = Math.sin(Math.PI * s) * 0.035 * (rnd() * 2 - 1);
          add(x + dir[0] * s * 0.32 + w, yy + dir[1] * s * 0.32 - s * s * 0.08, z + dir[2] * s * 0.32 + w,
            mix([50, 120, 55], [125, 200, 110], rnd()), 1.7, yy, 2);
        }
      }
    }
    return { C, A, P1, P2, L, petals, cols };
  });

  // ---------- Animation ----------
  const SPEED = 0.42; // how fast the build climbs, in scene units per second
  const TILT = 0.2;
  let start = performance.now();
  let hinted = false;

  function project(x, y, z, cosT, sinT) {
    const rx = x * cosT + z * sinT;
    const rz = -x * sinT + z * cosT;
    const ry = (y - 1.6) * Math.cos(TILT) - rz * Math.sin(TILT) + 1.6;
    const rz2 = (y - 1.6) * Math.sin(TILT) + rz * Math.cos(TILT);
    const p = 5 / (5 + rz2);
    return [cx + rx * unit * p, groundY - ry * unit * p, rz2, p];
  }

  function dot(sx, sy, size, p, alpha, col, depth) {
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha * (0.6 + 0.4 * clamp(0.5 - depth * 0.6));
    ctx.fillStyle = col;
    const s = Math.max(1, size * p * unit / 160);
    ctx.fillRect(sx - s / 2, sy - s / 2, s, s);
  }

  function frame(now) {
    const t = (now - start) / 1000;
    const level = -0.1 + t * SPEED;
    const theta = (Math.PI / 2) * Math.sin((now / 1000) * (Math.PI * 2 / 20));
    const cosT = Math.cos(theta), sinT = Math.sin(theta);

    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    // Faint glass dome, drawn once the bouquet is done.
    const domeA = clamp((level - 3.3) / 0.8);
    if (domeA > 0) {
      ctx.lineWidth = 1;
      for (const [k, a] of [[1, 0.16], [1.05, 0.1], [0.95, 0.07]]) {
        ctx.globalAlpha = domeA * a;
        ctx.strokeStyle = "#cfe3ee";
        ctx.beginPath();
        ctx.ellipse(cx, groundY - unit * 1.75, unit * 1.05 * k, unit * 1.72 * k, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // Pedestal, back half of the cone, stems and leaves, front half of the cone.
    const front = [];
    for (const q of fixed) {
      const a = clamp((level - q.ry) / 0.12);
      if (a <= 0) continue;
      const [sx, sy, d, p] = project(q.x, q.y, q.z, cosT, sinT);
      if (q.layer === 1 && d < 0) { front.push([sx, sy, q.size, p, a, q.col, d]); continue; }
      if (q.layer === 2) continue;
      dot(sx, sy, q.size, p, a * (q.layer === 1 ? 0.85 : 0.9), q.col, d);
    }
    for (const q of fixed) {
      if (q.layer !== 2) continue;
      const a = clamp((level - q.ry) / 0.12);
      if (a <= 0) continue;
      const [sx, sy, d, p] = project(q.x, q.y, q.z, cosT, sinT);
      dot(sx, sy, q.size, p, a, q.col, d);
    }
    for (const f of front) dot(f[0], f[1], f[2], f[3], f[4] * 0.85, f[5], f[6]);

    // Lilies, back to front, each opening once the build reaches it.
    const order = lilies.map((l) => [l, project(l.C[0], l.C[1], l.C[2], cosT, sinT)[2]]).sort((a, b) => b[1] - a[1]);
    for (const [l] of order) {
      const since = (level - (l.C[1] - 0.05)) / SPEED;
      if (since <= 0) continue;
      const appear = clamp(since / 0.4);
      const open = ease((since - 0.3) / 2.8);
      for (const pet of l.petals) {
        const D = [
          Math.cos(pet.ang) * l.P1[0] + Math.sin(pet.ang) * l.P2[0],
          Math.cos(pet.ang) * l.P1[1] + Math.sin(pet.ang) * l.P2[1],
          Math.cos(pet.ang) * l.P1[2] + Math.sin(pet.ang) * l.P2[2],
        ];
        const Sd = cross(l.A, D);
        const len = l.L * (0.55 + 0.45 * open) * (pet.inner ? 1 : 0.95);
        const phi0 = 0.12 + 0.95 * open, curl = 1.3 * open;
        const wmax = len * (pet.inner ? 0.34 : 0.27) * (0.55 + 0.45 * open);
        // Centerline of the petal, curling back at the tip.
        const line = [[0, 0]];
        let rr = 0, hh = 0;
        for (let s = 1; s <= 12; s++) {
          const u = s / 12, ph = phi0 + curl * u * u;
          rr += Math.sin(ph) * len / 12;
          hh += Math.cos(ph) * len / 12;
          line.push([rr, hh]);
        }
        for (const pt of pet.pts) {
          const fi = pt.u * 12, i0 = Math.floor(fi), i1 = Math.min(12, i0 + 1), fr = fi - i0;
          const r0 = line[i0][0] + (line[i1][0] - line[i0][0]) * fr;
          const h0 = line[i0][1] + (line[i1][1] - line[i0][1]) * fr;
          const w = wmax * Math.sin(Math.PI * Math.pow(pt.u, 0.75)) * (1 - 0.2 * pt.u) * pt.v;
          const x = l.C[0] + D[0] * r0 + l.A[0] * h0 + Sd[0] * w;
          const y = l.C[1] + D[1] * r0 + l.A[1] * h0 + Sd[1] * w;
          const z = l.C[2] + D[2] * r0 + l.A[2] * h0 + Sd[2] * w;
          const [sx, sy, d, p] = project(x, y, z, cosT, sinT);
          dot(sx, sy, 2.1, p, appear, pt.col, d);
        }
      }
      // Stamens with rusty pollen, once it's open.
      if (open > 0.45) {
        const sg = ease((open - 0.45) / 0.55);
        for (let k = 0; k < 7; k++) {
          const ang = (k / 6) * Math.PI * 2 + 0.3;
          const D = [
            Math.cos(ang) * l.P1[0] + Math.sin(ang) * l.P2[0],
            Math.cos(ang) * l.P1[1] + Math.sin(ang) * l.P2[1],
            Math.cos(ang) * l.P1[2] + Math.sin(ang) * l.P2[2],
          ];
          const pist = k === 6;
          const dir = pist ? l.A : norm([l.A[0] + D[0] * 0.45, l.A[1] + D[1] * 0.45, l.A[2] + D[2] * 0.45]);
          const len = l.L * (pist ? 0.75 : 0.62) * sg;
          for (let j = 0; j <= 9; j++) {
            const s = (j / 9) * len;
            const [sx, sy, d, p] = project(l.C[0] + dir[0] * s, l.C[1] + dir[1] * s, l.C[2] + dir[2] * s, cosT, sinT);
            const tip = j >= 8;
            dot(sx, sy, tip ? 2.6 : 1.4, p, 1, tip ? (pist ? "rgb(110,145,60)" : "rgb(170,75,25)") : "rgb(205,230,170)", d);
          }
        }
      }
    }

    if (!hinted && level > 4.2) { hinted = true; hint.classList.add("show"); }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener("pointerdown", () => {
    start = performance.now();
    hinted = false;
    hint.classList.remove("show");
  });
})();
</script>
</body>
</html>
